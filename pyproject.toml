[project]
name = "comfyui-kimodo-bridge"
description = "Kimodo text-to-motion nodes and production bridges for Mixamo, Unity Humanoid, and Rive 2D characters"
version = "1.0.0"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "peft>=0.18",
    "bvhio",
    "trimesh>=3.21.7",
    "scenepic>=1.1.0",
    "Pillow>=10.0",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/GuardSkill/ComfyUI-Kimodo-Bridge"
Documentation = "https://github.com/GuardSkill/ComfyUI-Kimodo-Bridge#readme"

[tool.comfy]
